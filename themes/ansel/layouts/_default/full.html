{{ define "main" }}
{{- /* A bare page: the content at full width, no section navigation, no table of
       contents, none of the article trimmings. Select with `layout: full` in the
       front matter. */ -}}
<div class="container-fluid mx-0 px-0">
<div class="d-flex row mx-auto justify-content-center">
  <div class="column col-12 col-xxl-10 my-3 main-column">
    <article class="bg-white rounded expanded-bg mb-4 shadow-sm p-3" id="post-content">
      <header class="border-secondary my-0 pb-4 pt-2 align-middle">
        <h1 class="entry-title my-3" property="title">{{ .Title | strings.FirstUpper | safeHTML }}</h1>
      </header>
      <div id="content-body" class="post-content border-secondary libertine clearfix full-width-page">
        {{ .Content }}
      </div>
    </article>
  </div>
</div>
</div>
{{ end }}
